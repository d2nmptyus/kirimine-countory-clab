        <div class="wrapper">
            <a href="index.html" class="logo">

    <section class="contact-mv">
        <h1 class="content-title">CONTACT</h1>
        <h2 class="content-sub-title">
            お問い合わせ
        </h2>
    </section>

    <div class="wrapper">
        <div class="contact-container">
            <h3 class="heading">お問い合わせ</h3>

            <form class="contact-form">
                <div class="form-item">
                    <label for="name">お名前：</label>
                    <input type="text" id="name" name="name" placeholder="山田　太郎">
                </div>

                <div class="form-item">
                    <label for="email">メールアドレス：</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com">
                </div>

                <div class="form-item select-item">
                    <label for="type">お問い合わせ種別：</label>
                    <select id="type" name="type">
                        <option value="">選択してください</option>
                        <option value="reservation">予約について</option>
                        <option value="question">施設について</option>
                        <option value="other">その他</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="message">お問い合わせ内容：</label>
                    <textarea id="message" name="message" placeholder="ご質問やご要望をお書きください。"></textarea>
                </div>

                <p class="privacy">
                    ご入力いただいた個人情報は、お問い合わせへの対応のみに使用し第三者への提供は行いません。
                </p>
                <button type="submit" class="submit-btn">送信</button>
            </form>
        </div>
    </div>



    <footer>
        <div class="footer-1st">
            <ul class="wrapper">
                <li class="item">
                    <a href="#"><img src="images/header-logo.png"></a>

                        </li>
                    </ul>
                </li>
                <li class="item">

                    <ul>
                        <li>

                        </li>

        <div class="footer-2nd">
